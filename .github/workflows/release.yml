name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/guetix-page-notes.zip
          generate_release_notes: true
