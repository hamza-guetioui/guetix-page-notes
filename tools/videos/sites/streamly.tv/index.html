<!doctype html>
<html lang="en">
<head>

<title>How to Be So Productive it Feels ILLEGAL · Streamly</title>
<link rel="icon" href="/favicon.svg" />
<style>
  html,body{margin:0;background:#0f0f0f;overflow:hidden}
  .wrap{position:relative;width:1459px;height:743px;zoom:var(--z,1)}

  /* our own logo over the original one */

  .logo i{display:grid;place-items:center;width:30px;height:21px;border-radius:6px;background:#ff2d55}
  .logo i::after{content:"";border-left:9px solid #fff;border-top:5.5px solid transparent;border-bottom:5.5px solid transparent;margin-left:2px}
</style>
</head>
<body>
<div class="wrap"><img src="/watch.webp" alt="" /><div class="logo"><i></i>Streamly</div></div>
<script>document.querySelector('.wrap').style.setProperty('--z', innerWidth / 1459)</script>
